<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 AI 學習中樞</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 小工具：Emoji 圖示 ---
        const Icon = ({e}) => <span className="mr-2">{e}</span>;

        function App() {
            const [screen, setScreen] = useState("dashboard");
            const [catalog, setCatalog] = useState(null);
            const [currentLesson, setCurrentLesson] = useState(null);
            const [currentQuiz, setCurrentQuiz] = useState(null);
            const [completedDays, setCompletedDays] = useState(
                JSON.parse(localStorage.getItem("completedDays") || "[]")
            );

            // 1. 初始載入：從 GitHub 抓取目錄 (index.json)
            useEffect(() => {
                fetch("./index.json")
                    .then(res => res.json())
                    .then(data => setCatalog(data.courses[0]));
            }, []);

            // 2. 當點擊開始時，抓取該天的 lesson.md 和 quiz.json
            const startDay = async (day) => {
                const path = `./content/python-basics/day-${day.day}`;
                try {
                    const [lessonRes, quizRes] = await Promise.all([
                        fetch(`${path}/lesson.md`).then(res => res.text()),
                        fetch(`${path}/quiz.json`).then(res => res.json())
                    ]);
                    setCurrentLesson({ ...day, htmlContent: marked.parse(lessonRes) });
                    setCurrentQuiz(quizRes.questions);
                    setScreen("reading");
                } catch (e) {
                    alert("內容尚未生成，請先去 GitHub Actions 執行生成腳本喔！");
                }
            };

            const markAsComplete = () => {
                const newCompleted = [...new Set([...completedDays, currentLesson.day])];
                setCompletedDays(newCompleted);
                localStorage.setItem("completedDays", JSON.stringify(newCompleted));
                setScreen("quiz");
            };

            if (!catalog) return <div className="p-10 text-center">載入中...</div>;

            // 找出今天該學哪一天 (第一個還沒完成的天數)
            const nextDay = catalog.days.find(d => !completedDays.includes(d.day)) || catalog.days[0];
            const progress = Math.round((completedDays.length / catalog.days.length) * 100);

            return (
                <div className="min-h-screen">
                    {/* 導覽列 */}
                    <nav className="sticky top-0 bg-white/80 backdrop-blur-md border-b p-4 flex justify-between items-center z-20">
                        <span className="font-bold text-indigo-600">🚀 {catalog.title}</span>
                        <button onClick={() => setScreen("dashboard")} className="text-sm text-slate-500">🏠 首頁</button>
                    </nav>

                    {/* 畫面切換 */}
                    {screen === "dashboard" && (
                        <div className="max-w-2xl mx-auto p-4">
                            <div className="bg-indigo-600 rounded-2xl p-6 text-white mb-6 shadow-lg">
                                <div className="text-sm opacity-80 mb-1">學習進度 {progress}%</div>
                                <div className="text-3xl font-bold mb-4">{completedDays.length} / {catalog.days.length} 天</div>
                                <div className="w-full bg-white/20 h-2 rounded-full">
                                    <div className="bg-white h-2 rounded-full transition-all" style={{width: `${progress}%`}}></div>
                                </div>
                            </div>

                            <h2 className="font-bold mb-4 text-slate-700">今日推薦任務</h2>
                            <div className="bg-white border rounded-2xl p-5 mb-8 shadow-sm">
                                <div className="flex justify-between items-start mb-3">
                                    <span className="bg-indigo-100 text-indigo-600 text-xs px-2 py-1 rounded">Day {nextDay.day}</span>
                                </div>
                                <h3 className="text-xl font-bold mb-4">{nextDay.title}</h3>
                                <button onClick={() => startDay(nextDay)} className="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold">開始學習</button>
                            </div>

                            <h2 className="font-bold mb-4 text-slate-700">全部課程</h2>
                            <div className="space-y-3">
                                {catalog.days.map(d => (
                                    <div key={d.day} className="bg-white border p-4 rounded-xl flex justify-between items-center opacity-90">
                                        <span className={completedDays.includes(d.day) ? "line-through text-slate-400" : ""}>
                                            Day {d.day}: {d.title}
                                        </span>
                                        {completedDays.includes(d.day) ? "✅" : <button onClick={() => startDay(d)} className="text-indigo-600 text-sm font-bold">進入</button>}
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {screen === "reading" && currentLesson && (
                        <div className="max-w-2xl mx-auto p-4 pb-20">
                            <button onClick={() => setScreen("dashboard")} className="mb-4 text-slate-400 text-sm">◀ 返回</button>
                            <div className="prose bg-white p-6 rounded-2xl border shadow-sm prose-indigo">
                                <div dangerouslySetInnerHTML={{ __html: currentLesson.htmlContent }} />
                            </div>
                            <button onClick={markAsComplete} className="w-full mt-6 bg-emerald-600 text-white py-4 rounded-2xl font-bold shadow-lg">我讀完了，進入測驗 ✅</button>
                        </div>
                    )}

                    {screen === "quiz" && currentQuiz && (
                        <div className="max-w-2xl mx-auto p-4">
                            <div className="bg-white p-6 rounded-2xl border text-center">
                                <div className="text-5xl mb-4">🎯</div>
                                <h2 className="text-2xl font-bold mb-4">測驗時間</h2>
                                <p className="text-slate-500 mb-6">AI 為你準備了 {currentQuiz.length} 題測驗，準備好了嗎？</p>
                                <div className="space-y-4">
                                    {currentQuiz.map((q, i) => (
                                        <div key={i} className="text-left p-4 border rounded-xl">
                                            <p className="font-bold mb-2">{i+1}. {q.question}</p>
                                            <div className="grid grid-cols-1 gap-2">
                                                {q.options.map((opt, idx) => (
                                                    <button key={idx} onClick={() => alert(idx === q.answerIndex ? "正確！" + q.explanation : "再想想看喔！")} className="text-left p-3 bg-slate-50 rounded-lg text-sm hover:bg-slate-100">{opt}</button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <button onClick={() => setScreen("dashboard")} className="mt-8 text-indigo-600 font-bold">完成複習，返回首頁</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
