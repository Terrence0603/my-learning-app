<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 AI 學習中樞</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [screen, setScreen] = useState("dashboard");
            const [catalog, setCatalog] = useState(null);
            const [currentLesson, setCurrentLesson] = useState(null);
            const [currentQuiz, setCurrentQuiz] = useState(null);
            const [searchTerm, setSearchTerm] = useState(""); // 新增：搜尋狀態
            const [completedDays, setCompletedDays] = useState(
                JSON.parse(localStorage.getItem("completedDays") || "[]")
            );

            useEffect(() => {
                fetch("./index.json")
                    .then(res => res.json())
                    .then(data => setCatalog(data.courses[0]));
            }, []);

            const startDay = async (day) => {
                const path = `./content/${catalog.id}/day-${day.day}`;
                try {
                    const [lessonRes, quizRes] = await Promise.all([
                        fetch(`${path}/lesson.md`).then(res => res.text()),
                        fetch(`${path}/quiz.json`).then(res => res.json())
                    ]);
                    // 如果抓到的文字包含 "404"，代表檔案真的還沒產生
                    if (lessonRes.includes("404: Not Found")) throw new Error("Not Generated");
                    
                    setCurrentLesson({ ...day, htmlContent: marked.parse(lessonRes) });
                    setCurrentQuiz(quizRes.questions);
                    setScreen("reading");
                } catch (e) {
                    alert("這天的內容還在努力生成中，請先去 GitHub Actions 執行管家腳本喔！");
                }
            };

            const markAsComplete = () => {
                const newCompleted = [...new Set([...completedDays, currentLesson.day])];
                setCompletedDays(newCompleted);
                localStorage.setItem("completedDays", JSON.stringify(newCompleted));
                setScreen("quiz");
            };

            if (!catalog) return <div className="p-10 text-center text-slate-500">正在喚醒學習管家...</div>;

            // 計算進度與過濾搜尋
            const nextDay = catalog.days.find(d => !completedDays.includes(d.day)) || catalog.days[0];
            const progress = Math.round((completedDays.length / catalog.days.length) * 100);
            
            // 新增：根據搜尋框內容過濾課程
            const filteredDays = catalog.days.filter(d => 
                d.title.toLowerCase().includes(searchTerm.toLowerCase()) || 
                `day ${d.day}`.includes(searchTerm.toLowerCase())
            );

            // 判斷目前這堂課是否已經完成過
            const isCurrentCompleted = currentLesson && completedDays.includes(currentLesson.day);

            return (
                <div className="min-h-screen">
                    {/* 導覽列 */}
                    <nav className="sticky top-0 bg-white/80 backdrop-blur-md border-b p-4 flex justify-between items-center z-20">
                        <span className="font-bold text-indigo-600">🚀 {catalog.title}</span>
                        <button onClick={() => setScreen("dashboard")} className="text-sm text-slate-500 font-bold hover:text-indigo-600">🏠 首頁</button>
                    </nav>

                    {/* 首頁儀表板 */}
                    {screen === "dashboard" && (
                        <div className="max-w-2xl mx-auto p-4">
                            <div className="bg-indigo-600 rounded-2xl p-6 text-white mb-6 shadow-lg shadow-indigo-200">
                                <div className="text-sm opacity-80 mb-1">學習進度 {progress}%</div>
                                <div className="text-3xl font-bold mb-4">{completedDays.length} / {catalog.days.length} 天</div>
                                <div className="w-full bg-white/20 h-2 rounded-full">
                                    <div className="bg-white h-2 rounded-full transition-all" style={{width: `${progress}%`}}></div>
                                </div>
                            </div>

                            <h2 className="font-bold mb-4 text-slate-700">🎯 今日推薦任務</h2>
                            <div className="bg-white border rounded-2xl p-5 mb-8 shadow-sm">
                                <div className="flex justify-between items-start mb-3">
                                    <span className="bg-indigo-100 text-indigo-600 text-xs px-2 py-1 rounded font-bold">Day {nextDay.day}</span>
                                </div>
                                <h3 className="text-xl font-bold mb-4 text-slate-800">{nextDay.title}</h3>
                                <button onClick={() => startDay(nextDay)} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold transition-colors">開始學習</button>
                            </div>

                            <div className="flex items-center justify-between mb-4">
                                <h2 className="font-bold text-slate-700">📚 全部課程與複習區</h2>
                            </div>
                            
                            {/* 新增：搜尋框 */}
                            <input 
                                type="text" 
                                placeholder="🔍 搜尋專有名詞或第幾天 (例如：MVP, Day 3)..." 
                                className="w-full p-3.5 rounded-xl border border-slate-200 mb-4 focus:ring-2 focus:ring-indigo-500 outline-none text-sm text-slate-700 shadow-sm"
                                value={searchTerm}
                                onChange={e => setSearchTerm(e.target.value)}
                            />

                            <div className="space-y-3">
                                {filteredDays.length === 0 ? (
                                    <div className="text-center p-6 text-slate-400 text-sm">找不到相關課程，換個關鍵字試試！</div>
                                ) : (
                                    filteredDays.map(d => (
                                        <div 
                                            key={d.day} 
                                            onClick={() => startDay(d)}
                                            className="bg-white border p-4 rounded-xl flex justify-between items-center cursor-pointer hover:border-indigo-300 hover:shadow-sm transition-all"
                                        >
                                            <span className={`text-sm ${completedDays.includes(d.day) ? "line-through text-slate-400" : "font-bold text-slate-700"}`}>
                                                Day {d.day}: {d.title}
                                            </span>
                                            {completedDays.includes(d.day) ? 
                                                <span className="text-emerald-500 text-xs font-bold bg-emerald-50 px-2 py-1 rounded">✅ 再次複習</span> : 
                                                <span className="text-indigo-600 text-xs font-bold bg-indigo-50 px-2 py-1 rounded">進入</span>
                                            }
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    )}

                    {/* 閱讀模式 */}
                    {screen === "reading" && currentLesson && (
                        <div className="max-w-2xl mx-auto p-4 pb-20">
                            <button onClick={() => setScreen("dashboard")} className="mb-4 text-slate-400 text-sm font-bold hover:text-indigo-600">◀ 返回目錄</button>
                            <div className="prose bg-white p-6 md:p-8 rounded-2xl border shadow-sm prose-indigo max-w-none">
                                <div dangerouslySetInnerHTML={{ __html: currentLesson.htmlContent }} />
                            </div>
                            <button onClick={markAsComplete} className={`w-full mt-6 text-white py-4 rounded-2xl font-bold shadow-lg transition-colors ${isCurrentCompleted ? 'bg-indigo-500 hover:bg-indigo-600' : 'bg-emerald-600 hover:bg-emerald-700'}`}>
                                {isCurrentCompleted ? "✅ 完成複習，進入測驗" : "我讀完了，進入測驗 ✅"}
                            </button>
                        </div>
                    )}

                    {/* 測驗模式 */}
                    {screen === "quiz" && currentQuiz && (
                        <div className="max-w-2xl mx-auto p-4">
                            <div className="bg-white p-6 rounded-2xl border shadow-sm">
                                <div className="text-center mb-8">
                                    <div className="text-5xl mb-2">🎯</div>
                                    <h2 className="text-2xl font-bold mb-2 text-slate-800">隨堂測驗</h2>
                                    <p className="text-slate-500 text-sm">{isCurrentCompleted ? "複習時間！來看看你的記憶力" : "趁熱打鐵，檢驗一下剛剛學到的知識"}</p>
                                </div>
                                
                                <div className="space-y-6">
                                    {currentQuiz.map((q, i) => (
                                        <div key={i} className="text-left p-5 border border-slate-100 bg-slate-50/50 rounded-xl">
                                            <p className="font-bold text-slate-700 mb-3 text-sm leading-relaxed">{i+1}. {q.question}</p>
                                            <div className="grid grid-cols-1 gap-2">
                                                {q.options.map((opt, idx) => (
                                                    <button 
                                                        key={idx} 
                                                        onClick={() => alert(idx === q.answerIndex ? "🎉 正確！\n\n" + q.explanation : "❌ 哎呀，再想想看喔！")} 
                                                        className="text-left p-3.5 bg-white border border-slate-200 rounded-xl text-sm text-slate-600 hover:bg-indigo-50 hover:border-indigo-200 hover:text-indigo-700 transition-colors"
                                                    >
                                                        {opt}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <button onClick={() => setScreen("dashboard")} className="w-full mt-8 bg-slate-800 text-white py-4 rounded-xl font-bold">🎉 完成並返回首頁</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
